name: teste-acesso
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install curl_cffi
      - run: python testes/teste_acesso.py http

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python testes/teste_acesso.py browser
